[workspace]
authors = ["vijay <vijpiml@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "simpok"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
quick = "python -m examples.quickstart"
tdgl = "python -m examples.tdgl_quickstart"
chc = "python -m examples.chc_quickstart"

[dependencies]
python = "3.13.*"
mojo = ">=1.0.0,<2"
max = ">=26.5.0,<27"
numpy = ">=2.5.2,<3"
matplotlib = ">=3.11.1,<4"
seaborn = ">=0.13.2,<0.14"
